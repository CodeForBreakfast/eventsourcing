# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for npm OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: 'release'

      # Generate a GitHub App token for verified commits
      - name: Generate GitHub App Token
        id: github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Auto-generate changeset for dependency updates
        run: bun run scripts/auto-generate-dependency-changeset.ts

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: bun run release
          version-script: bun run version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ steps.github-app-token.outputs.token }}
